# Publishes what a commit's Tiny Tapeout workflows produce to this repo's GitHub Pages: TT's viewer files (as its
# `viewer` job publishes them), every run's artifacts (but not the tools' binary databases) and job logs, a
# manifest.json describing them, and a summary.json of the results (see ../makerchip/publish.py). For
# Makerchip's TT views (github.com/stevehoover/makerchip-tt-views, whose README describes the layout) and for anyone
# else, without sign-in. Not part of TT's template; see UPSTREAM.md.
name: makerchip

on:
  workflow_run:
    workflows: [gds, test, docs]
    types: [completed]

permissions:
  actions: read   # to read the runs' artifacts and logs
  contents: read
  pages: write
  id-token: write

concurrency:
  group: makerchip-pages  # One deployment at a time; a newer pending run replaces an older one.

jobs:
  publish:
    # Pages deploys only from the default branch.
    if: github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      # Publish only the branch's latest commit (so an older commit's late run doesn't replace newer results), and
      # only once its gds run has completed (gds's viewer job also deploys Pages; this keeps the two apart). Each of
      # gds, test and docs triggers this, so the last of them to complete publishes everything.
      - name: Decide whether to publish
        id: when
        run: |
          head=$(gh api "repos/$REPO/branches/$BRANCH" --jq .commit.sha)
          gds=$(gh api "repos/$REPO/actions/runs?head_sha=$SHA" --jq '[.workflow_runs[] | select(.name == "gds")][0].status')
          echo "head=$head gds=$gds"
          echo "publish=$([ "$head" = "$SHA" ] && [ "$gds" = completed ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Checkout repo
        if: steps.when.outputs.publish == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ env.SHA }}
          path: repo

      # (See publish.py.)
      - name: Gather results
        if: steps.when.outputs.publish == 'true'
        run: python3 repo/.github/makerchip/publish.py

      # (Unique per attempt, so a rerun's doesn't collide with an earlier attempt's.)
      - name: Upload
        id: upload
        if: steps.when.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}

      # As actions/deploy-pages does, but with a build version of its own: deploy-pages's is always the commit's SHA,
      # which the viewer job's deployment also uses, and Pages requires it to be unique (with two, Pages may keep
      # serving the viewer's).
      - name: Deploy
        if: steps.when.outputs.publish == 'true'
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          oidc=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)
          status_url=$(gh api "repos/$REPO/pages/deployments" -F artifact_id="$ARTIFACT_ID" \
            -f pages_build_version="$SHA-makerchip-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" -f oidc_token="$oidc" --jq .status_url)
          for i in $(seq 60); do
            sleep 5
            status=$(gh api "${status_url#https://api.github.com/}" --jq .status)
            echo "$status"
            case "$status" in
              succeed) exit 0 ;;
              deployment_failed|deployment_content_failed|deployment_cancelled|deployment_lost) exit 1 ;;
            esac
          done
          exit 1
